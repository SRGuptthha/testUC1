[build-system]
requires = ["setuptools>=58.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerable-py-app"
version = "0.1.0"
description = "Intentionally outdated Python app for testing dependency remediation agents"
requires-python = ">=3.7"
dependencies = [
    "requests==2.25.0",
    "urllib3==1.26.5",
    "jinja2==2.11.2",
    "flask==1.1.2",
    "werkzeug==1.0.1",
    "PyYAML==5.3.1",
    "cryptography==3.3.2",
    "certifi==2021.5.30",
    "pandas==1.1.5",
    "numpy==1.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest==5.4.3",
    "ipython==7.16.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
